<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avaliação III</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <h1>Avaliação III</h1>
    <div class="bloco">
      <h2>1) Média de um aluno</h2>
      <label>Aluno: <input id="aluno"></label>
      <label>Disciplina: <input id="disciplina"></label>
      <label>Nota 1: <input id="nota1" type="number" step="0.01"></label>
      <label>Nota 2: <input id="nota2" type="number" step="0.01"></label>
      <button onclick="q1Calcular()">Calcular média</button>
      <button onclick="q1Limpar()">Limpar</button>
      <pre id="q1out" class="saida"></pre>
    </div>

    <div class="bloco">
      <h2>2) Idade em 2024</h2>
      <label>Ano de nascimento: <input id="anoNasc" type="number"></label>
      <button onclick="q2Calcular()">Calcular</button>
      <button onclick="q2Limpar()">Limpar</button>
      <pre id="q2out" class="saida"></pre>
    </div>

    <div class="bloco">
      <h2>3) Fatorial</h2>
      <label>Número (≥ 0): <input id="fatNum" type="number"></label>
      <button onclick="q3Calcular()">Calcular</button>
      <button onclick="q3Limpar()">Limpar</button>
      <pre id="q3out" class="saida"></pre>
    </div>

    <div class="bloco">
      <h2>4) Par ou ímpar</h2>
      <label>Número: <input id="parimparNum" type="number"></label>
      <button onclick="q4Calcular()">Verificar</button>
      <button onclick="q4Limpar()">Limpar</button>
      <pre id="q4out" class="saida"></pre>
    </div>

    <div class="bloco">
      <h2>5) Tabuada</h2>
      <label>Número: <input id="tabNum" type="number"></label>
      <label>Até (limite): <input id="tabLim" type="number" value="10"></label>
      <button onclick="q5Calcular()">Gerar</button>
      <button onclick="q5Limpar()">Limpar</button>
      <pre id="q5out" class="saida"></pre>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
