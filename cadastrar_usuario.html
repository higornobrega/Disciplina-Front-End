<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-cadastro">

    <div class="container-cadastro">
        <div class="card-cadastro">
            <div class="card-body-cadastro">

                <div class="text-center-cadastro">
                    <h1 class="title-cadastro">Cadastro de Usuário</h1>
                </div>

                <form action="login.html" method="POST" enctype="multipart/form-data">

                    <div class="form-row-cadastro">
                        <div class="form-group-cadastro">
                            <label for="nome">Nome</label>
                            <input type="text" class="input-cadastro" id="nome" name="campoNome" required>
                        </div>

                        <div class="form-group-cadastro">
                            <label for="cpf">CPF</label>
                            <input type="text" class="input-cadastro" id="cpf" name="campoCPF" placeholder="000.000.000-00"required>
                        </div>
                    </div>

                    <div class="form-row-cadastro">
                        <div class="form-group-cadastro">
                            <label for="email">E-mail</label>
                            <input type="email" class="input-cadastro" id="email" name="campoEmail" placeholder="E-mail" required>
                        </div>

                        <div class="form-group-cadastro">
                            <label for="profissao">Profissão</label>
                            <input type="text" class="input-cadastro" id="profissao" name="campoProfissao" required>
                        </div>

                        <div class="form-group-cadastro">
                            <label for="dataNascimento">Data de Nascimento</label>
                            <input type="date" class="input-cadastro" id="dataNascimento" name="campoDataNascimento"
                                required>
                        </div>
                    </div>

                    <div class="form-row-cadastro">
                        <div class="form-group-cadastro">
                            <label for="logradouro">Logradouro</label>
                            <input type="text" class="input-cadastro" id="logradouro" name="campoLogradouro"
                                placeholder="Rua, Avenida..." required>
                        </div>

                        <div class="form-group-cadastro">
                            <label for="numero">Número</label>
                            <input type="text" class="input-cadastro" id="numero" name="campoNumero" placeholder="Número"
                                required>
                        </div>
                    </div>

                    <div class="form-row-cadastro">
                        <div class="form-group-cadastro">
                            <label for="quadra">Quadra</label>
                            <input type="text" class="input-cadastro" id="quadra" name="campoQuadra" placeholder="Quadra">
                        </div>

                        <div class="form-group-cadastro">
                            <label for="lote">Lote</label>
                            <input type="text" class="input-cadastro" id="lote" name="campoLote" placeholder="Lote">
                        </div>

                        <div class="form-group-cadastro">
                            <label for="bairro">Bairro</label>
                            <input type="text" class="input-cadastro" id="bairro" name="campoBairro" placeholder="Bairro"
                                required>
                        </div>
                    </div>

                    <div class="form-row-cadastro">
                        <div class="form-group-cadastro">
                            <label for="cep">CEP</label>
                            <input type="text" class="input-cadastro" id="cep" name="campoCEP" placeholder="00000-000"
                                required>
                        </div>

                        <div class="form-group-cadastro">
                            <label for="cidade">Cidade</label>
                            <select class="input-cadastro" id="cidade" name="campoCidade" required>
                                <option value="">Selecione a cidade</option>
                                <option value="São Paulo">São Paulo</option>
                                <option value="Rio de Janeiro">Rio de Janeiro</option>
                            </select>
                        </div>

                        <div class="form-group-cadastro">
                            <label for="estado">Estado</label>
                            <select class="input-cadastro" id="estado" name="campoEstado" required>
                                <option value="">Selecione o estado</option>
                                <option value="SP">São Paulo</option>
                                <option value="RJ">Rio de Janeiro</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn-cadastro">Salvar</button>

                </form>

            </div>
        </div>
    </div>

</body>

</html>
