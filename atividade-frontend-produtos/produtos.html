<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Produtos • Loja TecDev</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Loja TecDev</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="nav" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="pagamento.html">Pagamento</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container flex-grow-1 py-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h1 class="h4 m-0">Produtos</h1>
      <button id="btnFinalizarCompra" class="btn btn-primary">
        Finalizar compra
        <span class="badge bg-white text-primary ms-2" id="cartCount">0</span>
      </button>
    </div>

    <div class="row g-3" id="listaProdutos" aria-live="polite"></div>
  </main>

  <footer class="py-4 bg-white border-top">
    <div class="container text-center text-muted small">
      &copy; <span id="year"></span> Loja TecDev
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('year').textContent = new Date().getFullYear();
      renderListaProdutos();
      document.getElementById('btnFinalizarCompra').addEventListener('click', () => {
        window.location.href = 'pagamento.html';
      });
    });
  </script>
</body>

</html>
