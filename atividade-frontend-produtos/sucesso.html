<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compra concluída • Loja TecDev</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Loja TecDev</a>
    </div>
  </nav>

  <main class="container flex-grow-1 py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <div class="text-center mb-4">
              <div class="display-6">✅</div>
              <h1 class="h4 mt-2">Compra realizada com sucesso!</h1>
              <p class="text-muted">Abaixo estão os detalhes do seu pedido.</p>
            </div>
            <div id="detalhesPedido"></div>
            <div class="text-center mt-4">
              <a class="btn btn-primary" href="produtos.html">Voltar para a loja</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 bg-white border-top">
    <div class="container text-center text-muted small">
      &copy; <span id="year"></span> Loja TecDev
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('year').textContent = new Date().getFullYear();
      renderTelaSucesso();
    });
  </script>
</body>

</html>
