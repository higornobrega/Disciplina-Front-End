<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login • Loja TecDev</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">Loja TecDev</a>
    </div>
  </nav>

  <main class="container flex-grow-1 py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4 mb-3 text-center">Acesse sua conta</h1>
            <form id="loginForm" class="needs-validation" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" required>
                <div class="invalid-feedback">Informe um e-mail válido.</div>
              </div>
              <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" minlength="4" required>
                <div class="invalid-feedback">Informe uma senha (mín. 4).</div>
              </div>
              <div class="d-grid gap-2">
                <button id="btnLogar" type="submit" class="btn btn-primary">Logar</button>
                <button id="btnConfirmar" type="button" class="btn btn-outline-primary">Confirmar</button>
              </div>
            </form>
          </div>
        </div>
        <p class="text-center text-muted small mt-3">Use “Logar” ou “Confirmar” para seguir.</p>
      </div>
    </div>
  </main>

  <footer class="py-4 bg-white border-top">
    <div class="container text-center text-muted small">
      &copy; <span id="year"></span> Loja TecDev
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      const yearSpan = document.getElementById('year');
      if (yearSpan) { yearSpan.textContent = new Date().getFullYear(); }

      const form = document.getElementById('loginForm');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (!form.checkValidity()) {
          form.classList.add('was-validated');
          return;
        }
        window.location.href = 'produtos.html';
      });

      document.getElementById('btnConfirmar').addEventListener('click', () => {
        window.location.href = 'produtos.html';
      });
    })();
  </script>
</body>

</html>
