<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pagamento • Loja TecDev</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="produtos.html">LojaEx</a>
    </div>
  </nav>

  <main class="container flex-grow-1 py-4">
    <div class="row g-4">
      <div class="col-12 col-lg-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <h1 class="h5 mb-3">Pagamento</h1>
            <form id="formPagamento" class="needs-validation" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="bandeira" class="form-label">Bandeira do Cartão</label>
                  <select id="bandeira" class="form-select" required>
                    <option value="" selected disabled>Selecione...</option>
                    <option>Visa</option>
                    <option>Mastercard</option>
                    <option>American Express</option>
                  </select>
                  <div class="invalid-feedback">Escolha a bandeira do cartão.</div>
                </div>
                <div class="col-md-6">
                  <label for="nome" class="form-label">Nome impresso no cartão</label>
                  <input id="nome" class="form-control" required>
                  <div class="invalid-feedback">Informe o nome impresso.</div>
                </div>
                <div class="col-12">
                  <label for="numero" class="form-label">Número do Cartão</label>
                  <input id="numero" class="form-control" inputmode="numeric" minlength="13" maxlength="19" required>
                  <div class="invalid-feedback">Informe um número de cartão válido.</div>
                </div>
                <div class="col-md-6">
                  <label for="expiracao" class="form-label">Data de Expiração (MM/AA)</label>
                  <input id="expiracao" class="form-control" placeholder="MM/AA" pattern="^(0[1-9]|1[0-2])\/(\d{2})$"
                    required>
                  <div class="invalid-feedback">Informe uma data no formato MM/AA.</div>
                </div>
                <div class="col-md-6">
                  <label for="cvv" class="form-label">Código de Segurança</label>
                  <input id="cvv" class="form-control" inputmode="numeric" minlength="3" maxlength="4" required>
                  <div class="invalid-feedback">Informe o CVV.</div>
                </div>
              </div>
              <div class="d-grid mt-4">
                <button id="btnFinalizar" class="btn btn-success" type="submit">Finalizar</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h6 mb-3">Resumo da compra</h2>
            <ul class="list-group list-group-flush mb-3" id="resumoLista"></ul>
            <div class="d-flex justify-content-between">
              <span class="fw-semibold">Total</span>
              <span id="resumoTotal" class="fw-bold"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 bg-white border-top">
    <div class="container text-center text-muted small">
      &copy; <span id="year"></span> Loja TecDev
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('year').textContent = new Date().getFullYear();
      renderResumoCompra();
      const form = document.getElementById('formPagamento');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!form.checkValidity()) {
          form.classList.add('was-validated');
          return;
        }
        // Apenas navega para a tela de sucesso; os dados podem ser fictícios
        window.location.href = 'sucesso.html';
      });
    });
  </script>
</body>

</html>
