<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-cadastro">

    <div class="container-cadastro">
        <div class="row-login">
            <div class="col-login">
                <div class="card-login">
                    <div class="card-body-login">

                        <div class="text-center-login">
                            <h1 class="title-login">e-Commerce</h1>
                        </div>

                        <form action="menu.html" method="POST">

                            <div class="form-group-login">
                                 <label for="email">E-mail</label>
                                <input type="email" name="email" class="input-login" placeholder="Digite seu e-mail..."
                                    required>
                            </div>

                            <div class="form-group-login">
                                 <label for="senha">Senha</label>
                                <input type="password" name="senha" class="input-login"
                                    placeholder="Digite sua senha..." required>
                            </div>

                            <button type="submit" class="btn-login">
                                Entrar
                            </button>

                        </form>
                        <div class="text-center">
                            <form action="cadastrar_usuario.html" method="GET">
                                <button type="submit" class="btn-text-only">
                                    Cadastrar Novo Usuário
                                </button>
                            </form>
                        </div>

                    </div>

                </div>
            </div>


        </div>
    </div>

</body>

</html>
